x-app: &app
  build:
    context: ${E3_ROOT}
    dockerfile: deploy/e3-azure/Dockerfile
  image: bdi-e3-azure:latest
  environment:
    BDI__KAFKA__BOOTSTRAP: kafka:9092
    BDI__POSTGRES__HOST: postgres
    BDI__POSTGRES__PORT: "5432"
  volumes:
    - ${E3_ROOT}/data:/app/data
    - ${E3_ROOT}/results:/app/results
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ${E3_ROOT}/.runtime/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic binance.aggtrades.replay --partitions 3 --replication-factor 1 --config retention.ms=-1

  postgres:
    image: postgres:16.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: bdi
      POSTGRES_USER: bdi
      POSTGRES_PASSWORD: bdi
    volumes:
      - ${E3_ROOT}/.runtime/postgres:/var/lib/postgresql/data
      - ${E3_ROOT}/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdi -d bdi"]
      interval: 5s
      timeout: 5s
      retries: 24

  # Chay replay, REST official va phan tich. Gioi han rieng de replay giu nhip on dinh.
  e3-cli:
    <<: *app
    profiles: [manual]
    cpus: 1.00
    mem_limit: 3g

  # Moi watermark la mot container, dung 1 core. GROUP=5 dung toi da 6 core
  # (5 Spark + replay), chua 2 core cho Kafka/Postgres/OS tren VM 8 core.
  e3-job:
    <<: *app
    profiles: [manual]
    cpus: 1.00
    mem_limit: 2500m
    environment:
      BDI__KAFKA__BOOTSTRAP: kafka:9092
      BDI__POSTGRES__HOST: postgres
      BDI__POSTGRES__PORT: "5432"
      SPARK_MASTER: local[1]
      SPARK_DRIVER_MEMORY: 1g
      SPARK_SHUFFLE_PARTITIONS: "4"
