# Hạ tầng: Kafka (KRaft) · Postgres · Grafana · bộ nhận WS · job Spark streaming.
#   docker compose up -d kafka postgres grafana        # chỉ hạ tầng (dev trên host)
#   docker compose up -d                               # toàn bộ, kể cả pipeline live
#
# Tên service được dùng trong experiments/e4_chaos/chaos.sh — đổi tên thì sửa cả ở đó.

x-app: &app
  build: { context: ., dockerfile: docker/Dockerfile }
  image: bdi-app:latest
  restart: unless-stopped
  environment:
    BDI__KAFKA__BOOTSTRAP: kafka:9092
    BDI__POSTGRES__HOST: postgres
    BDI__POSTGRES__PORT: "5432"
  volumes:
    - ./data:/app/data
    - ./results:/app/results
  depends_on:
    kafka-init: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }

services:
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on: { kafka: { condition: service_healthy } }
    restart: "no"
    # retention -1: giữ vĩnh viễn để replay (E3/E4). Dung lượng live ~ vài GB/ngày cho 5 cặp.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in binance.aggtrades.live binance.aggtrades.replay; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1 --config retention.ms=-1
        done

  postgres:
    image: postgres:16.6
    restart: unless-stopped
    ports: ["5433:5432"]   # host 5433: tránh đụng Postgres cài sẵn trên máy
    environment: { POSTGRES_DB: bdi, POSTGRES_USER: bdi, POSTGRES_PASSWORD: bdi }
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdi -d bdi"]
      interval: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [postgres]

  ws-producer:
    <<: *app
    command: ["python", "-m", "bdi.ingest.ws_producer"]

  raw-archive:
    <<: *app
    command: ["python", "-m", "bdi.stream.raw_archive"]

  stream-candles:
    <<: *app
    command: ["python", "-m", "bdi.stream.stream_candles", "--watermark", "5", "--source", "stream", "--run-id", "live",
              "--anomaly", "--anomaly-history", "official"]

  # Nến official qua REST, cập nhật mỗi phút (Grafana + lịch sử cho detector)
  official-poller:
    <<: *app
    command: ["python", "-m", "bdi.ingest.rest_klines", "--loop", "--minutes", "10", "--warmup-days", "3"]

  # C5: luồng thứ 2 ghi MỌI phiên bản nến (update mode) để đo time-to-convergence
  #   docker compose --profile c5 up -d stream-candles-update
  stream-candles-update:
    <<: *app
    profiles: [c5]
    environment:
      BDI__KAFKA__BOOTSTRAP: kafka:9092
      BDI__POSTGRES__HOST: postgres
      BDI__POSTGRES__PORT: "5432"
      SPARK_DRIVER_MEMORY: 1g
      SPARK_SHUFFLE_PARTITIONS: "4"
    command: ["python", "-m", "bdi.stream.stream_candles", "--watermark", "30", "--output-mode", "update",
              "--source", "stream:update", "--run-id", "live_update"]

volumes:
  kafka-data:
  pg-data:
